.course{height:calc(100vh - 125px);min-height:540px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}.lessonDetail{font-size:15px;line-height:1.75;color:#31465b}.lessonDetail h3{font-size:17px;color:#193954;margin:24px 0 8px}.lessonDetail p{margin:10px 0 15px}.lessonDetail table{width:100%;border-collapse:collapse;margin:15px 0 22px;font-size:13px}.lessonDetail td,.lessonDetail th{border:1px solid #d8e3ed;padding:10px;text-align:left;vertical-align:top}.lessonDetail th{background:#e9f2f9;color:#274765}.lessonDetail tr:nth-child(even) td{background:#f8fbfd}@media(max-width:850px){.course{height:auto;min-height:450px;max-height:75vh}}</style></head><body><div id="drawerHotspot" onmouseenter="toggleSidebar(true)"></div><button id="drawerTab" aria-expanded="false" aria-controls="lessonDrawer" onclick="toggleSidebar(!document.body.classList.contains('drawerOpen'))" title="Browse chapter concepts">☰<span> Lessons</span></button><nav id="lessonDrawer" aria-label="Chapter lessons" onmouseleave="toggleSidebar(false)"></nav><div id="drawerBackdrop" onclick="toggleSidebar(false)"></div><header class="top"><div><div class="brand">◈ DES AI Tutor</div><div class="small">Chapter 1 · Introduction to Discrete-Event Simulation</div></div><div class="viewSwitch" id="headerSwitcher"><div class="tag" id="headerStatus">Course Materials</div></div></header><main class="wrap" id="app"></main>
<script>const DATA={"lessons":[{"lecture":1,"title":"Why study simulation?","slides":"2–7","body":"Real systems contain interacting processes, limited resources, queues, and uncertainty. Changing an operating policy in the real system can be costly or disruptive. Simulation makes it possible to investigate “what if?” questions using a model instead.","idea":"A simulation is an experiment with a simplified representation of a system, not a promise of an exact future prediction.","example":"","detail":"<h3>A real-system experiment versus a model experiment<\/h3><p>Imagine a busy security checkpoint. Passengers arrive throughout the day, officers inspect them, and a line forms whenever all screening stations are occupied. Changing the arrangement while passengers are moving through the checkpoint may interrupt operations. A simulation instead reproduces the essential operations in a model so we can investigate possible changes without disrupting the checkpoint.<\/p><p>The same reasoning applies to adding hospital staff or generating extra traffic on a live communication network. Each is an intervention that may be expensive, disruptive, or risky in the real system.<\/p><h3>What simulation gives us<\/h3><p>We run a model, observe its behavior, and calculate quantities such as waiting time and resource utilization. A simulation result is evidence under the assumptions of the model, not a guarantee that reality will behave identically.<\/p>"},{"lecture":1,"title":"Performance evaluation","slides":"8–12","body":"Performance evaluation turns “How well does this system work?” into quantitative measures. Three approaches are direct measurement, analytical modeling, and simulation modeling.","idea":"Measurement observes a real system; analytical modeling applies equations; simulation runs a computational model and estimates its performance from generated observations.","example":"","detail":"<h3>Three ways to evaluate performance<\/h3><table><tr><th>Approach<\/th><th>How it works<\/th><th>Typical limitation<\/th><\/tr><tr><td>Measurement<\/td><td>Observe an existing system and record its results<\/td><td>Changing the real system may be difficult<\/td><\/tr><tr><td>Analytical modeling<\/td><td>Describe a system using equations and solve for measures<\/td><td>Complex interacting behavior may be hard to solve<\/td><\/tr><tr><td>Simulation<\/td><td>Run a program representing the system and summarize its outputs<\/td><td>Developing and validating the model takes effort<\/td><\/tr><\/table><h3>Screening-lane comparison<\/h3><p>Consider a security checkpoint with four, five, or six screening lanes. For each configuration, ask: How long do passengers wait? How busy are the officers? What happens at peak times? What are the costs? A comparison needs more than a single number: very short queues may require additional operating resources.<\/p>"},{"lecture":1,"title":"Systems, models, and boundaries","slides":"13–20","body":"A system is a collection of interacting objects pursuing a purpose. A model is an abstraction that retains characteristics relevant to a particular question. A simulation produces an artificial operating history for analysis.","idea":"Choose the system boundary according to the question being studied. A useful model need not reproduce every feature of the real system.","example":"","detail":"<h3>System, model, and system boundary<\/h3><p>A <b>system<\/b> is a collection of interacting components organized toward a purpose. Its <b>environment<\/b> includes factors that may affect it from outside. A <b>model<\/b> retains the relationships necessary to answer a particular study question.<\/p><p>For a banking service system, we might represent customers arriving, waiting for a teller, receiving service, and departing. The model does not necessarily need to represent the bank building's paint color, furniture arrangement, or every financial transaction. Whether such details matter depends on the question being investigated.<\/p><h3>Why assumptions matter<\/h3><p>Suppose we assume customers are served in arrival order and the line can hold everyone who arrives. These assumptions help define the model. Different assumptions can lead to different simulated outcomes, so they must be stated and justified.<\/p>"},{"lecture":1,"title":"Classifying models","slides":"21–22, 25–27","body":"Models may be physical or mathematical, static or dynamic, deterministic or stochastic, and discrete or continuous. Dynamic models explicitly represent change over time; stochastic models include uncertain inputs.","idea":"In a discrete system, important state changes occur at specific points in time; continuous systems have state variables changing continuously.","example":"","detail":"<h3>Classify a model along several dimensions<\/h3><table><tr><th>Dimension<\/th><th>First type<\/th><th>Second type<\/th><\/tr><tr><td>Representation<\/td><td>Physical model: a scaled representation<\/td><td>Mathematical model: symbols, rules, equations<\/td><\/tr><tr><td>Time<\/td><td>Static: no explicit evolution over time<\/td><td>Dynamic: behavior changes through time<\/td><\/tr><tr><td>Uncertainty<\/td><td>Deterministic: same input gives the same output<\/td><td>Stochastic: at least some inputs are random<\/td><\/tr><tr><td>State change<\/td><td>Discrete: changes at distinct instants<\/td><td>Continuous: state varies continuously<\/td><\/tr><\/table><h3>Two contrasting systems<\/h3><p>At a bank, the <b>number of customers in the system<\/b> jumps when a customer arrives or departs. Between those moments, the count remains unchanged. This is a discrete state variable.<\/p><p>For a reservoir, the <b>water level<\/b> can rise or fall continuously as water enters and leaves. That is a continuous state example. The right model type depends on the system and the study purpose.<\/p>"},{"lecture":1,"title":"Entities, attributes, and activities","slides":"23–24","body":"An entity is an object of interest. An attribute describes an individual entity. An activity is a process that takes time to complete.","idea":"Do not confuse an individual attribute with a variable describing the whole system.","example":"","detail":"<h3>Banking-system example<\/h3><table><tr><th>Concept<\/th><th>Example<\/th><th>Why it fits<\/th><\/tr><tr><td>Entity<\/td><td>Customer<\/td><td>An object represented in the system<\/td><\/tr><tr><td>Attribute<\/td><td>Checking-account balance<\/td><td>Information belonging to an individual customer<\/td><\/tr><tr><td>Activity<\/td><td>Making a deposit<\/td><td>A process that occupies a period of time<\/td><\/tr><tr><td>Event<\/td><td>Customer arrival or departure<\/td><td>An occurrence at a particular instant<\/td><\/tr><tr><td>State<\/td><td>Number of busy tellers<\/td><td>Describes the system right now<\/td><\/tr><\/table><p>A customer's account balance and the number of busy tellers are different kinds of information: the first belongs to an entity; the second describes the entire service system at a particular time.<\/p>"},{"lecture":1,"title":"Events and system state","slides":"23–25, 39","body":"An event is an instantaneous occurrence that may change system state. System state is the information needed to describe a system at a particular time.","idea":"Events happen at instants; activities occupy intervals. DES records the changes between snapshots rather than assuming that everything changes continuously.","example":"","detail":"<h3>Follow a bank through three events<\/h3><table><tr><th>Time<\/th><th>Event<\/th><th>Customers in system<\/th><\/tr><tr><td>0<\/td><td>Initially empty<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>Customer A arrives<\/td><td>1<\/td><\/tr><tr><td>4<\/td><td>Customer B arrives<\/td><td>2<\/td><\/tr><tr><td>7<\/td><td>Customer A departs<\/td><td>1<\/td><\/tr><\/table><p>Arrivals and departures occur at instants, and the system count changes at those instants. By contrast, serving Customer A from minute 2 to minute 7 takes time and is an <b>activity<\/b>. DES follows the state transitions caused by events.<\/p><p>In a real model, a snapshot can include several state variables together: customers waiting, tellers busy, and other details needed to continue the simulation.<\/p>"},{"lecture":1,"title":"When simulation is appropriate","slides":"29–38","body":"Simulation is useful for complex interactions, comparing alternatives, understanding bottlenecks, and testing policies safely. It is less suitable when a simpler method suffices, credible assumptions or data are unavailable, or costs outweigh benefits.","idea":"Simulation evaluates a specified alternative; optimization seeks the alternative to select. They can be combined, but they are not the same task.","example":"","detail":"<h3>When simulation is a good choice<\/h3><p>Use it to explore interacting system behavior, compare operating policies, discover bottlenecks, and evaluate alternatives without changing a live system. For example, testing several different scheduling procedures in a model can be safer than switching rules repeatedly during real operations.<\/p><h3>When it is not<\/h3><p>If a simple calculation already answers the question, a simulation may add unnecessary cost and complexity. Simulation is also weak when no credible data or assumptions can be obtained, or when decision-makers expect an exact prediction from a stochastic model.<\/p><h3>Simulation is not optimization<\/h3><p><b>Simulation:<\/b> “What happens if we use this particular arrangement?” <b>Optimization:<\/b> “Which arrangement should we choose?” Optimization can propose candidates; simulation can estimate their performance.<\/p>"},{"lecture":1,"title":"Steps in a simulation study","slides":"40–54","body":"A simulation study starts by stating the problem and objectives, then develops a conceptual model, gathers data, translates the model, verifies and validates it, designs experiments, and analyzes output.","idea":"The process is iterative: later findings can reveal the need to revisit assumptions or the model.","example":"","detail":"<h3>A simulation study is an iterative investigation<\/h3><p>Begin by defining the problem, deciding what performance means, and setting the model boundary. Next, build a conceptual description, identify input information, translate the description into a working model, and determine whether the model behaves as intended.<\/p><p><b>Verification<\/b> asks whether the model was implemented according to its specification. <b>Validation<\/b> asks whether the model is a credible representation for the intended purpose. Once the model is trustworthy enough, design experiments, run them, and analyze the outputs.<\/p><p>Suppose an experimental result seems implausible. That might require revisiting assumptions, inputs, or implementation and running the study again. The process is not strictly one-way.<\/p>"},{"lecture":2,"title":"From randomness to observations","slides":"2–8","body":"Simulation uses random numbers to represent uncertainty. Uniform draws between zero and one can be mapped through a probability distribution into observations, such as a time in minutes.","idea":"A uniform number is not itself a service duration. With 1, 2, and 3 minutes having probabilities 0.20, 0.30, and 0.50, a draw of 0.14 selects 1 minute while 0.82 selects 3 minutes.","example":"","detail":"<h3>Convert uniform draws to sampled times<\/h3><p>Suppose a service duration can be 1, 2, or 3 minutes. Assign each time a probability and a cumulative interval of uniform numbers.<\/p><table><tr><th>Service time<\/th><th>Probability<\/th><th>U interval<\/th><\/tr><tr><td>1 minute<\/td><td>0.20<\/td><td>0 ≤ U &lt; 0.20<\/td><\/tr><tr><td>2 minutes<\/td><td>0.30<\/td><td>0.20 ≤ U &lt; 0.50<\/td><\/tr><tr><td>3 minutes<\/td><td>0.50<\/td><td>0.50 ≤ U &lt; 1.00<\/td><\/tr><\/table><p><b>U = 0.14:<\/b> falls in the first interval, so the generated service time is <b>1 minute<\/b>. <b>U = 0.82:<\/b> falls in the third interval, so the generated time is <b>3 minutes<\/b>.<\/p><p>The random number selects an outcome; it is not itself a duration. A pseudorandom generator produces a reproducible sequence by a computational procedure.<\/p>"},{"lecture":2,"title":"Anatomy of a queue","slides":"9–16","body":"A queueing system has a calling population, arrival process, service mechanism, system capacity, and queue discipline. FCFS serves eligible waiting customers in arrival order.","idea":"An arrival starts service when an eligible server is available and nobody ahead must be served; otherwise the customer waits. When service finishes, a waiting customer may start, or the server becomes idle.","example":"","detail":"<h3>Elements of a queueing system<\/h3><p>A queue has a calling population (customers who may request service), an arrival process, a service mechanism, a system capacity, and a queue discipline. Under <b>first-come, first-served (FCFS)<\/b>, earlier waiting customers are served first.<\/p><h3>Arrival and completion rules<\/h3><table><tr><th>Situation<\/th><th>What happens<\/th><\/tr><tr><td>Customer arrives; server idle<\/td><td>Customer begins service<\/td><\/tr><tr><td>Customer arrives; server busy<\/td><td>Customer joins the queue<\/td><\/tr><tr><td>Service completes; queue nonempty<\/td><td>Next waiting customer begins service<\/td><\/tr><tr><td>Service completes; queue empty<\/td><td>Server becomes idle<\/td><\/tr><\/table><p>For a simplified single-server system, the state can be tracked through the number waiting and whether the server is busy or idle.<\/p>"},{"lecture":2,"title":"Single-server simulation","slides":"17–21","body":"A small single-server example tracks arrival times, service durations, service start times, and completion times for successive customers.","idea":"For FCFS with one server, service start is the later of arrival and previous completion. Completion equals start plus service duration. Waiting equals start minus arrival.","example":"","detail":"<h3>Work through a six-customer FCFS queue<\/h3><p>The following service times and arrival times form a small single-server example. A service cannot begin before the customer arrives or before the previous service finishes.<\/p><table><tr><th>Customer<\/th><th>Arrival<\/th><th>Duration<\/th><th>Start<\/th><th>Finish<\/th><th>Wait<\/th><\/tr><tr><td>1<\/td><td>0<\/td><td>2<\/td><td>0<\/td><td>2<\/td><td>0<\/td><\/tr><tr><td>2<\/td><td>2<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>0<\/td><\/tr><tr><td>3<\/td><td>6<\/td><td>3<\/td><td>6<\/td><td>9<\/td><td>0<\/td><\/tr><tr><td>4<\/td><td>7<\/td><td>2<\/td><td>9<\/td><td>11<\/td><td>2<\/td><\/tr><tr><td>5<\/td><td>9<\/td><td>1<\/td><td>11<\/td><td>12<\/td><td>2<\/td><\/tr><tr><td>6<\/td><td>15<\/td><td>4<\/td><td>15<\/td><td>19<\/td><td>0<\/td><\/tr><\/table><p><b>Customer 4:<\/b> arrives at 7, but Customer 3 occupies the server until 9. Therefore start = max(7, 9) = 9; finish = 9 + 2 = 11; wait = 9 − 7 = <b>2 minutes<\/b>.<\/p>"},{"lecture":2,"title":"Building a simulation table","slides":"19–27","body":"A simulation table records input observations alongside state changes and outputs. For the single-server lecture example, columns include customer ID, arrival, service duration, start, completion, and wait.","idea":"The table is an artificial history of the system: it reflects queue rules and earlier completions, not merely random draws. Chronological events may be listed separately from passenger order.","example":"","detail":"<h3>From input observations to an operating history<\/h3><p>A simulation table combines arrivals, service durations, and the service rule. Using one FCFS server, compute each row from the row before it:<\/p><p><b>Service start = max(arrival, previous finish).<\/b><br/><b>Service finish = start + duration.<\/b><br/><b>Waiting time = start − arrival.<\/b><\/p><h3>List the actual events in time order<\/h3><table><tr><th>Clock<\/th><th>Event<\/th><\/tr><tr><td>0<\/td><td>Customer 1 arrives<\/td><\/tr><tr><td>2<\/td><td>Customer 1 departs; Customer 2 arrives<\/td><\/tr><tr><td>3<\/td><td>Customer 2 departs<\/td><\/tr><tr><td>6<\/td><td>Customer 3 arrives<\/td><\/tr><tr><td>7<\/td><td>Customer 4 arrives<\/td><\/tr><tr><td>9<\/td><td>Customer 3 departs; Customer 5 arrives<\/td><\/tr><tr><td>11<\/td><td>Customer 4 departs<\/td><\/tr><tr><td>12<\/td><td>Customer 5 departs<\/td><\/tr><tr><td>15<\/td><td>Customer 6 arrives<\/td><\/tr><tr><td>19<\/td><td>Customer 6 departs<\/td><\/tr><\/table><p>Notice that the event history is organized by time, not simply by writing one customer’s complete life before the next.<\/p>"},{"lecture":2,"title":"Performance from a simulation table","slides":"27–32","body":"Basic performance statistics can be calculated after processing simulated customers: average wait, fraction waiting, time in system, idle time, and utilization.","idea":"Average wait is total waiting divided by observed customers; utilization is busy time divided by observation period. These are estimates from the simulated history.","example":"","detail":"<h3>Calculate output statistics<\/h3><p>For the six-customer table, waiting times are 0, 0, 0, 2, 2, 0 minutes. The total waiting time is 4 minutes, and the <b>mean waiting time<\/b> is 4/6 ≈ <b>0.67 minute<\/b>.<\/p><p>Two customers experience a positive wait, so the <b>fraction who waited<\/b> is 2/6 ≈ <b>33.3%<\/b>.<\/p><p><b>Time in system<\/b> for Customer 4 is finish minus arrival = 11 − 7 = <b>4 minutes<\/b>: two waiting and two in service. Over an explicitly chosen observation interval, utilization is total server busy time divided by the length of that interval.<\/p><h3>Why simulate a grocery checkout?<\/h3><p>A grocery store with one checkout counter can have uncertain customer-arrival intervals and service times. Simulating a series of customers reveals the waiting, idle periods, and queue behavior produced by those random inputs. One simulated sequence is an observation, not a universal prediction.<\/p>"},{"lecture":2,"title":"Inventory simulation","slides":"38–42","body":"Inventory models explore stock on hand, uncertain demand, replenishment, shortages, and possibly backorders. In periodic review, the stock position is checked every N time units and an order may replenish toward a target M.","idea":"This example illustrates how a simulator can track stock levels and replenishment decisions instead of customer queues.","example":"","detail":"<h3>Periodic-review inventory<\/h3><p>Imagine a shop that checks its inventory every <b>N<\/b> days. At each review, the shop compares its inventory position with a target level <b>M<\/b>. If it is below M, an order is placed to restore the position toward M.<\/p><h3>Small illustration<\/h3><p>Assume M = 20 units and reviews occur every N = 3 days. At a review, if inventory position is 12 units, the shop orders 20 − 12 = <b>8 units<\/b>. Actual deliveries may happen after a lead time. Demand between reviews reduces stock, and unmet demand may become backorders depending on the model’s rules.<\/p><p>This is an illustrative arithmetic example of the <b>(M, N)<\/b> rule, not a claim about a particular optimal stock level. The simulator follows demand, orders, deliveries, and inventory state through time.<\/p>"},{"lecture":2,"title":"Newsdealer and financial outcomes","slides":"43–48","body":"The newsdealer example connects uncertain demand with revenue, purchasing costs, salvage, and profit. Repeated simulated outcomes help compare financial decisions.","idea":"The lesson is how different simulated demand outcomes lead to different revenue, costs, and profit. Each model needs its own clearly specified accounting rule.","example":"","detail":"<h3>Newsdealer: money follows simulated demand<\/h3><p>A newsdealer must decide how many newspapers to purchase before knowing that day’s demand. They earn revenue from sold papers, pay to purchase stock, and may recover some salvage value from unsold copies.<\/p><h3>Illustrative daily calculation<\/h3><p>Suppose 10 papers are purchased for $1 each, sold for $2 each, and unsold copies have a $0.20 salvage value. If demand is 8, eight papers sell, leaving two unsold.<\/p><table><tr><th>Term<\/th><th>Calculation<\/th><th>Value<\/th><\/tr><tr><td>Sales revenue<\/td><td>8 × $2<\/td><td>$16.00<\/td><\/tr><tr><td>Purchasing cost<\/td><td>10 × $1<\/td><td>$10.00<\/td><\/tr><tr><td>Salvage value<\/td><td>2 × $0.20<\/td><td>$0.40<\/td><\/tr><tr><td>Profit<\/td><td>16 − 10 + 0.40<\/td><td>$6.40<\/td><\/tr><\/table><p>Different random demands lead to different daily profits. Repeated simulation trials help examine the trade-off between buying too few and buying too many. The prices here are teaching values for illustrating the calculation.<\/p>"},{"lecture":3,"title":"DES building blocks and lists","slides":"3–8","body":"An event-driven simulator needs a current state, a simulated clock, entities and attributes, ordered waiting lists, and event notices. A Future Event List (FEL) holds event notices ordered by scheduled occurrence time.","idea":"A passenger waiting list and the FEL are not interchangeable: one stores waiting entities ordered by queue rules, the other stores future events ordered by event time.","example":"","detail":"<h3>Two kinds of ordered lists<\/h3><p>A <b>waiting list<\/b> contains entities that cannot begin service yet. Under FCFS, they are ordered by arrival. A <b>Future Event List (FEL)<\/b> contains notices for scheduled future events, ordered by event time.<\/p><table><tr><th>Event type<\/th><th>Scheduled time<\/th><\/tr><tr><td>Event 1<\/td><td>7.25<\/td><\/tr><tr><td>Event 2<\/td><td>11.20<\/td><\/tr><tr><td>Event 4<\/td><td>22.11<\/td><\/tr><tr><td>Event 3<\/td><td>22.13<\/td><\/tr><\/table><p>Although “Event 4” has a larger label than “Event 3,” it must be executed first because <b>22.11 &lt; 22.13<\/b>. The simulated clock selects the earliest time, not the smallest label.<\/p>"},{"lecture":3,"title":"Activities versus conditional delays","slides":"9–12","body":"An activity has a duration computable when it begins, such as a sampled service time. A delay ends only when a condition becomes true, such as a waiting passenger gaining access to a counter.","idea":"In the lecture’s terminology, completion of an activity is a scheduled primary event; completion of a conditional delay is a secondary transition, not itself placed on the FEL.","example":"","detail":"<h3>Activity: completion time becomes known at the start<\/h3><p>If an inspection begins at CLOCK = 100 and lasts 5 minutes, its scheduled completion time is <b>105<\/b>. The simulator can place a completion notice on the Future Event List immediately.<\/p><h3>Delay: completion depends on future conditions<\/h3><p>A caller waiting for a service agent does not necessarily know when service will begin. The delay ends when an eligible agent becomes free and the caller reaches the front of the queue.<\/p><p>In this event-scheduling terminology, an activity completion is a <b>primary event<\/b> placed on the FEL. The ending of a conditional delay is a <b>secondary transition<\/b>, triggered by state conditions; it is not separately scheduled at a predetermined future time.<\/p>"},{"lecture":3,"title":"System snapshots","slides":"15–17","body":"A snapshot captures the system at one simulation clock time. It includes state variables, entities and relevant attributes, waiting lists, future-event notices, and cumulative counters used for output measures.","idea":"Current queue length and cumulative total waiting time are different kinds of information. Both may be needed to continue the run and later summarize it.","example":"","detail":"<h3>What must a snapshot contain?<\/h3><p>A snapshot is a description of the simulation at a particular CLOCK value. It includes the current system state, relevant entity information, any queues or lists, the Future Event List, and cumulative statistics needed at the end.<\/p><table><tr><th>Field at CLOCK = 10<\/th><th>Illustrative value<\/th><\/tr><tr><td>Queue length<\/td><td>2 customers<\/td><\/tr><tr><td>Server status<\/td><td>Busy<\/td><\/tr><tr><td>Next event notice<\/td><td>Service completion at 12<\/td><\/tr><tr><td>Accumulated waiting time<\/td><td>7 minutes<\/td><\/tr><\/table><p>The queue length is a <b>current state<\/b>; accumulated waiting time is a <b>running statistic<\/b>; the completion at 12 is a <b>future event<\/b>. Keeping these distinct helps a simulator continue correctly and compute output measures later.<\/p>"},{"lecture":3,"title":"Future-event scheduling","slides":"18–23","body":"An event-scheduling simulator identifies the earliest notice on the FEL, moves the clock to that time, processes the event, updates state, and inserts any newly scheduled notices.","idea":"The clock jumps to the imminent event time instead of advancing in fixed tiny steps when nothing occurs. Use a consistent rule when event times tie.","example":"","detail":"<h3>Next-event time advancement<\/h3><p>Suppose CLOCK = 5 and the FEL contains the following notices:<\/p><table><tr><th>Event<\/th><th>Time<\/th><\/tr><tr><td>Customer arrival<\/td><td>9<\/td><\/tr><tr><td>Service completion<\/td><td>7<\/td><\/tr><tr><td>Inventory review<\/td><td>12<\/td><\/tr><\/table><p>The next event is <b>service completion at 7<\/b>. Advance CLOCK directly from 5 to 7; remove that notice; process the completion; update the system state; and schedule any new events caused by it.<\/p><p>The earliest event remaining on the original FEL is the arrival at <b>9<\/b>. There is no need to process times 5.1, 5.2, or 6 when nothing is scheduled to happen then.<\/p>"},{"lecture":3,"title":"Starting and ending a run","slides":"24–29","body":"Initialization sets the clock, state, lists, statistics, and initial event notices. Bootstrapping schedules the next arrival using the current arrival time plus an interarrival duration. Service starts generate completion notices.","idea":"A stopping event or another clearly stated termination condition defines when the simulation ends.","example":"","detail":"<h3>Bootstrapping the arrival stream<\/h3><p>At CLOCK = 10, assume a customer has just arrived and the next interarrival duration is 3 minutes. Place a new arrival notice at <b>10 + 3 = 13<\/b>. Scheduling the notice does not immediately move CLOCK to 13.<\/p><h3>Service-completion notices<\/h3><p>If a customer begins service at CLOCK = 16 and the service duration is 4 minutes, create a <b>service completion<\/b> notice at time <b>20<\/b>. If the server is still busy when another customer arrives, that customer joins the waiting line instead of receiving an invented completion time.<\/p><h3>Stopping a run<\/h3><p>One simple stopping method is to schedule an end-of-simulation event at a predetermined future time. Another method stops when a specified event condition is reached. The stopping rule must be defined before interpreting the run’s statistics.<\/p>"},{"lecture":3,"title":"Simulation world views","slides":"30–32","body":"Event scheduling focuses on event handlers and state transitions. Process interaction follows each entity’s journey through the system. Activity scanning checks conditions required to start activities.","idea":"These views express the same modeled system from different perspectives: event handlers, entity life cycles, or activity-start conditions.","example":"","detail":"<h3>Three ways to express a simulation<\/h3><table><tr><th>World view<\/th><th>What it emphasizes<\/th><\/tr><tr><td>Event scheduling<\/td><td>What happens at each arrival or completion event<\/td><\/tr><tr><td>Process interaction<\/td><td>The steps followed by each entity during its life cycle<\/td><\/tr><tr><td>Activity scanning<\/td><td>Whether conditions for starting activities are satisfied<\/td><\/tr><\/table><p>Consider a customer arriving at a grocery checkout. In <b>process interaction<\/b>, describe the journey: arrive, wait if necessary, receive service, depart. In <b>event scheduling<\/b>, write arrival and service-completion routines that update state and schedule the next notice. Both represent the same underlying behavior from different perspectives.<\/p>"},{"lecture":3,"title":"Tracing an event-driven model","slides":"33–38","body":"A manual event trace shows how each event changes the queue, resource status, clock, FEL, and accumulated statistics. It complements the per-customer simulation table from Lecture 2.","idea":"On arrival, begin service if the eligible server is idle, otherwise enqueue. On completion, begin the next waiting service or mark the resource idle.","example":"","detail":"<h3>Manually trace a single-server event sequence<\/h3><p>Initially, a checkout counter is idle. Customer A arrives at minute 2 and needs 4 minutes of service. B arrives at minute 3 and needs 2 minutes.<\/p><table><tr><th>CLOCK / Event<\/th><th>Queue after event<\/th><th>Counter<\/th><th>New completion<\/th><\/tr><tr><td>2 / A arrives<\/td><td>0<\/td><td>Busy<\/td><td>6 (A)<\/td><\/tr><tr><td>3 / B arrives<\/td><td>1<\/td><td>Busy<\/td><td>None<\/td><\/tr><tr><td>6 / A completes<\/td><td>0<\/td><td>Busy<\/td><td>8 (B)<\/td><\/tr><tr><td>8 / B completes<\/td><td>0<\/td><td>Idle<\/td><td>None<\/td><\/tr><\/table><p>At time 6, A completes service. B is already waiting, so B begins service immediately. The counter remains busy, and a new completion notice is scheduled for <b>6 + 2 = 8<\/b>. At time 8 the queue is empty, so the counter becomes idle.<\/p>"},{"lecture":3,"title":"Records and list structures","slides":"39–42","body":"Simulators store entities and event notices as records. Lists support inserting, searching, removing, and ordering these records; arrays and linked structures are possible implementations.","idea":"An entity record contains its identifier and attributes; an event notice stores event type, scheduled time, and identifiers needed for handling it.","example":"","detail":"<h3>What belongs in a record?<\/h3><p>A <b>customer record<\/b> can hold an identifier, arrival time, and other attributes needed for service and waiting rules. An <b>event notice<\/b> must identify which event to execute and when, with enough information to update the relevant customer or resource.<\/p><table><tr><th>Customer waiting record<\/th><th>Event notice<\/th><\/tr><tr><td>ID: 14<\/td><td>Type: Service completion<\/td><\/tr><tr><td>Arrival: 12<\/td><td>Event time: 18<\/td><\/tr><tr><td>Queue position: 2<\/td><td>Customer ID: 9<\/td><\/tr><\/table><p>Lists can be stored using arrays, linked records, or other data structures. The best choice depends on how often the simulator inserts, searches for, or removes entries. A priority-ordered FEL and an FCFS waiting line have different ordering requirements.<\/p>"},{"lecture":3,"title":"Simulation program structure","slides":"43–49","body":"A typical event-scheduling program includes initialization, a timing routine, event routines, a termination check, and results generation. The timing routine selects the next event; event routines update states and statistics.","idea":"A simulation program separates time advancement, state-changing event logic, and statistics collection into identifiable routines.","example":"","detail":"<h3>Five responsibilities of an event-driven program<\/h3><table><tr><th>Routine<\/th><th>Purpose<\/th><\/tr><tr><td>Initialization<\/td><td>Set CLOCK, empty queues, available resources, counters, and initial event notices<\/td><\/tr><tr><td>Timing<\/td><td>Find the imminent event and advance CLOCK to its time<\/td><\/tr><tr><td>Event routine<\/td><td>Execute the event, update state, and schedule any new notices<\/td><\/tr><tr><td>Termination check<\/td><td>Determine whether the run has reached its stopping rule<\/td><\/tr><tr><td>Report generation<\/td><td>Compute and present performance measures from recorded statistics<\/td><\/tr><\/table><h3>How the routines work together<\/h3><p>Initialize an empty system and schedule an arrival. The timing routine advances to the arrival. The arrival handler may start service and add a completion notice. When the completion occurs, the handler updates the queue and the server. The cycle repeats until the termination rule is met, after which the results routine summarizes outcomes.<\/p>"}],"banks":[[{"id":"Q1-A","heading":"Q1-A  |  Resource allocation","prompt":"Our airport has six check-in counters. Sometimes the business-class counter is idle while coach passengers are waiting in line. What problem does this suggest, and what should the airline investigate to improve the situation without adding more counters?","options":[],"answer":"The allocation of check-in counters may be inefficient. The airline should investigate whether sharing or reallocating the existing counters could reduce waiting and improve resource utilization.","rubric":"Identify uneven allocation or underutilization; propose investigating the assignment or sharing of the six existing counters.","table":[],"lecture":1,"correctOption":null,"lo":1},{"id":"Q1-B","heading":"Q1-B  |  Missed flights","prompt":"Some provincial passengers arrive well before their scheduled flights but still miss their departures because they spend too long in airport processing. What problem should our simulation investigate to help reduce these missed flights?","options":[],"answer":"The airline should investigate whether check-in delays and passenger-service arrangements contribute to missed flights, and whether changes in processing policies can help provincial passengers finish on time.","rubric":"Connect airport processing delays or passenger-service arrangements with missed provincial departures.","table":[],"lecture":1,"correctOption":null,"lo":1},{"id":"Q1-C","heading":"Q1-C  |  Different passenger needs","prompt":"Provincial passengers must catch their reserved flights, while commuter passengers can wait for a later departure. Both groups depend on the same airport check-in facilities. What problem should the airline investigate when deciding how these groups should be served?","options":[],"answer":"The airline should investigate how to organize check-in service to help provincial passengers meet departure times without creating unnecessary delays for commuter passengers.","rubric":"Recognize different flight requirements and trade-offs between passenger groups.","table":[],"lecture":1,"correctOption":null,"lo":1},{"id":"Q1-D","heading":"Q1-D  |  Financial consequences","prompt":"Two check-in arrangements use the same six counters and operate the same scheduled flights. However, one arrangement causes more provincial passengers to miss their flights and receive refunds. What problem should the airline investigate, considering its financial performance?","options":[],"answer":"The airline should investigate how check-in arrangements affect missed flights, eligible refunds, and airline profit. Reducing missed flights and refunds could improve financial performance.","rubric":"Connect check-in arrangements to missed-flight refunds and profitability.","table":[],"lecture":1,"correctOption":null,"lo":1},{"id":"Q2-A","heading":"Q2-A","prompt":"The airline wants to evaluate changes to passenger-processing operations without disrupting actual airport services. Why might simulation be a suitable approach?","options":["A.  Simulation guarantees that all passengers will experience shorter waits.","B.  Simulation allows different operating arrangements to be investigated using a model.","C.  Simulation eliminates all randomness in passenger arrivals.","D.  Simulation produces exact predictions without assumptions."],"answer":"ANSWER  B    •  Simulation permits controlled comparisons without changing real operations; it does not guarantee exact results.","rubric":"","table":[],"lecture":1,"correctOption":"B","lo":2},{"id":"Q2-B","heading":"Q2-B","prompt":"Which feature of our airport makes discrete-event simulation particularly useful?","options":["A.  All passengers require exactly the same processing time.","B.  The airport only operates one type of flight.","C.  Passenger arrivals, resource availability, queues, and flight departures interact over time.","D.  Passenger-processing operations do not affect one another."],"answer":"ANSWER  C    •  DES represents interacting processes whose states change at identifiable events.","rubric":"","table":[],"lecture":1,"correctOption":"C","lo":2},{"id":"Q2-C","heading":"Q2-C","prompt":"Why might it be difficult to evaluate the entire airport passenger-processing system using a simple mathematical formula?","options":["A.  The system contains interacting processes, uncertain processing durations, and limited resources.","B.  Mathematical models cannot represent passenger waiting times.","C.  The airport has a fixed number of check-in counters.","D.  Flight departures occur at known times."],"answer":"ANSWER  A    •  The combined stochastic and interacting processes can make a simple analytical solution impractical.","rubric":"","table":[],"lecture":1,"correctOption":"A","lo":2},{"id":"Q3-A","heading":"Q3-A","prompt":"Our simulation aims to investigate airport passenger-processing performance and flight outcomes. Which processes should be included?","options":["A.  Aircraft maintenance, fueling, and runway construction.","B.  Only passenger check-in.","C.  Check-in, security screening, and relevant boarding outcomes.","D.  Aircraft operations at the destination airport."],"answer":"ANSWER  C    •  The model should cover the downstream processes needed to assess passenger-processing decisions.","rubric":"","table":[],"lecture":1,"correctOption":"C","lo":3},{"id":"Q3-B","heading":"Q3-B","prompt":"Why can aircraft travel between the departure and destination airports be excluded from our simulation?","options":["A.  Flight travel never affects airline operations.","B.  The aircraft journey after departure is not required to investigate passenger processing at the departure airport.","C.  Simulation cannot represent aircraft movement.","D.  All aircraft have identical travel times."],"answer":"ANSWER  B    •  Model scope is defined by the study objective.","rubric":"","table":[],"lecture":1,"correctOption":"B","lo":3},{"id":"Q3-C","heading":"Q3-C","prompt":"A commuter passenger completes security but cannot board because the next flight is full. How should this passenger be treated within our system boundary?","options":["A.  The passenger immediately leaves the modeled system.","B.  The passenger returns to check-in.","C.  The passenger is treated as having completed the journey.","D.  The passenger remains in the modeled system while waiting for a subsequent flight."],"answer":"ANSWER  D    •  Unboarded commuters continue waiting for later departures.","rubric":"","table":[],"lecture":1,"correctOption":"D","lo":3},{"id":"Q4-A","heading":"Q4-A","prompt":"Our airport has changing queues, unpredictable passenger processing times, and events that occur at particular times. Which classification best describes the model?","options":["A.  Static, deterministic, continuous.","B.  Dynamic, stochastic, discrete.","C.  Dynamic, deterministic, continuous.","D.  Static, stochastic, continuous."],"answer":"ANSWER  B    •  The system changes with time, contains randomness, and has discrete state-changing events.","rubric":"","table":[],"lecture":1,"correctOption":"B","lo":4},{"id":"Q4-B","heading":"Q4-B","prompt":"Why is our airport simulation a dynamic model rather than a static model?","options":["A.  The airport contains multiple physical buildings.","B.  Passengers have different ticket classes.","C.  The number of waiting passengers and the status of resources change over time.","D.  The model contains fixed flight schedules."],"answer":"ANSWER  C    •  Dynamic models explicitly represent the system evolving over time.","rubric":"","table":[],"lecture":1,"correctOption":"C","lo":4},{"id":"Q4-C","heading":"Q4-C","prompt":"Which statement best explains why our airport model is both stochastic and discrete?","options":["A.  All passenger processing times are fixed, but passengers use different counters.","B.  The system has no randomness, and its state changes continuously.","C.  The airport contains multiple resources, so every variable must be random.","D.  Some inputs are random, while important system state changes occur at distinct events."],"answer":"ANSWER  D    •  Stochastic refers to random inputs; discrete refers to event-driven changes in state.","rubric":"","table":[],"lecture":1,"correctOption":"D","lo":4},{"id":"Q5-A","heading":"Q5-A  |  Entities","prompt":"Think about the passengers, facilities, and services involved in our airport simulation. What different types of entities would you represent in the model? Identify at least three.","options":[],"answer":"Passengers; check-in counters; security screening resources/officers; flights.","rubric":"Accept at least three distinct modeled object/resource types. Passenger subclasses alone should not count as three different entity types.","table":[],"lecture":1,"correctOption":null,"lo":5},{"id":"Q5-B","heading":"Q5-B  |  Attributes","prompt":"Each passenger in our simulation needs information that distinguishes them from other passengers. What attributes would you assign to a passenger? Give at least three examples.","options":[],"answer":"Passenger type; ticket class; airport arrival time; assigned flight or scheduled departure (where applicable).","rubric":"Accept three valid individual passenger properties, not global airport state variables.","table":[],"lecture":1,"correctOption":null,"lo":5},{"id":"Q5-C","heading":"Q5-C  |  Activities","prompt":"Passengers go through several processes while moving through the airport. Identify two activities that take time in our airport simulation, and briefly describe what happens during each.","options":[],"answer":"Check-in processing (a counter processes passenger check-in); security screening (a resource screens the passenger before they proceed).","rubric":"Name two valid time-consuming activities and briefly state what happens.","table":[],"lecture":1,"correctOption":null,"lo":5},{"id":"Q5-D","heading":"Q5-D  |  Events","prompt":"In a discrete-event simulation, events are occurrences that may change the system state. What events would you expect to occur in our airport simulation? Give at least three examples.","options":[],"answer":"Passenger arrival; check-in completion; security completion; flight departure.","rubric":"Accept at least three distinct instantaneous events, not extended processes such as check-in service.","table":[],"lecture":1,"correctOption":null,"lo":5},{"id":"Q5-E","heading":"Q5-E  |  System state variables","prompt":"Imagine pausing our airport simulation at a particular moment. What system state variables would help describe how busy the airport is at that time? Give at least three examples.","options":[],"answer":"Number waiting at check-in; number waiting at security; number of busy check-in counters; number of busy security resources; number waiting at the commuter gate.","rubric":"Accept at least three relevant current system-state quantities, not only individual passenger attributes.","table":[],"lecture":1,"correctOption":null,"lo":5},{"id":"Q6-A","heading":"Q6-A","prompt":"Suppose provincial passengers experience unusually long delays at check-in. How could this affect their progress through the airport?","options":["A.  Security screening will automatically become faster.","B.  Their scheduled flight departures will automatically be postponed.","C.  They may reach security later and become more likely to miss their flights.","D.  Check-in waiting time cannot influence subsequent processes."],"answer":"ANSWER  C    •  Delays can propagate from check-in through security to flight outcomes.","rubric":"","table":[],"lecture":1,"correctOption":"C","lo":6},{"id":"Q6-B","heading":"Q6-B","prompt":"Why should check-in and security screening be considered together in our simulation?","options":["A.  Passengers must complete check-in before security, so delays at one stage can affect the next.","B.  Both processes always require identical service times.","C.  Security screening does not have limited resources.","D.  Check-in and security operate completely independently."],"answer":"ANSWER  A    •  The stages are connected by passenger flow.","rubric":"","table":[],"lecture":1,"correctOption":"A","lo":6},{"id":"Q6-C","heading":"Q6-C","prompt":"Suppose a new check-in arrangement reduces check-in waiting times, but passengers still experience long security queues. What does this suggest?","options":["A.  The simulation must contain an error.","B.  Reducing check-in waiting always guarantees shorter total airport processing time.","C.  Security screening should be removed from the simulation.","D.  Improving one processing stage does not necessarily eliminate delays elsewhere in the system."],"answer":"ANSWER  D    •  Improving check-in alone does not necessarily remove congestion at security.","rubric":"","table":[],"lecture":1,"correctOption":"D","lo":6},{"id":"Q7-A","heading":"Q7-A","prompt":"The airline wants to determine which check-in arrangement performs best using the same six counters. Which set of measures would provide the most useful basis for this decision?","options":["A.  Average waiting time and queue length only.","B.  Number of check-in counters and security stations only.","C.  Passenger waiting times, resource utilization, missed-flight outcomes, and airline profit.","D.  Total number of passengers arriving at the airport only."],"answer":"ANSWER  C    •  A balanced evaluation includes customer service, resource use, flight outcomes, and finances.","rubric":"","table":[],"lecture":1,"correctOption":"C","lo":7},{"id":"Q7-B","heading":"Q7-B","prompt":"Suppose a new check-in arrangement reduces the number of provincial passengers who miss flights and qualify for refunds. Flight schedules and operating costs remain unchanged. What financial effect could this have?","options":["A.  The airline operating costs must increase.","B.  The airline may retain more ticket revenue through fewer refunds, increasing profit.","C.  Ticket prices automatically increase.","D.  The number of check-in counters must decrease."],"answer":"ANSWER  B    •  Fewer applicable refunds can improve profit when other financial inputs are fixed.","rubric":"","table":[],"lecture":1,"correctOption":"B","lo":7},{"id":"Q7-C","heading":"Q7-C","prompt":"Two check-in policies use the same six counters. Policy A has higher counter utilization, while Policy B results in fewer refunds and greater airline profit. What should the airline conclude?","options":["A.  Policy A must be better because higher utilization is always desirable.","B.  Policy B must always be better regardless of passenger service.","C.  Counter utilization is the only meaningful measure.","D.  The airline should evaluate both financial outcomes and passenger-service performance before selecting a policy."],"answer":"ANSWER  D    •  Utilization should be considered alongside passenger outcomes and profit.","rubric":"","table":[],"lecture":1,"correctOption":"D","lo":7}],[{"id":"Q1-A","heading":"Q1-A  |  Short answer","prompt":"In a simplified check-in example, service time is 1 minute with probability 0.20, 2 minutes with probability 0.30, and 3 minutes with probability 0.50. Using the cumulative-probability method, what two service times are generated by U = 0.14 and U = 0.82? Give both times in order.","options":[],"answer":"1 minute; 3 minutes.","rubric":"Accept only both ordered sampled durations. 0.14 is in the first cumulative interval; 0.82 is in the third. No distribution formulas or code required.","table":[],"lecture":2,"correctOption":null,"lo":1},{"id":"Q1-B","heading":"Q1-B  |  Short answer","prompt":"A simplified airport check-in example has possible service times of 2, 4, and 6 minutes, with probabilities 0.25, 0.50, and 0.25, respectively. What service times result from U = 0.35 and U = 0.90? Give both in order.","options":[],"answer":"4 minutes; 6 minutes.","rubric":"Accept both ordered durations. Cumulative cutoffs are 0.25, 0.75, and 1.00. No other numerical method required.","table":[],"lecture":2,"correctOption":null,"lo":1},{"id":"Q1-C","heading":"Q1-C  |  Short answer","prompt":"For a small teaching example, the next interarrival interval is 1, 3, or 5 minutes, with probabilities 0.40, 0.35, and 0.25. Using uniform draws U = 0.10 and U = 0.60, which two interarrival intervals would you sample?","options":[],"answer":"1 minute; 3 minutes.","rubric":"Accept only the two ordered interval durations. Cutoffs are 0.40, 0.75, 1.00. Do not require the student to name a formal probability distribution.","table":[],"lecture":2,"correctOption":null,"lo":1},{"id":"Q2-A","heading":"Q2-A  |  Multiple choice","prompt":"Under the airport’s baseline arrangement, all five coach check-in counters are busy when a commuter coach passenger arrives. No earlier passenger can immediately be served. What happens?","options":["A.  The passenger uses the provincial business-only counter.","B.  The passenger joins the coach check-in waiting queue.","C.  The passenger boards the next available flight without checking in.","D.  A sixth coach-only counter is added."],"answer":"Correct answer: B","rubric":"The baseline has five eligible coach counters, and arriving coach passengers wait when none is available.","table":[],"lecture":2,"correctOption":"B","lo":2},{"id":"Q2-B","heading":"Q2-B  |  Multiple choice","prompt":"Which rule best describes FCFS service in the baseline coach check-in queue?","options":["A.  Serve passengers in their order of arrival when an eligible counter becomes free.","B.  Serve the passenger with the highest ticket price first.","C.  Always serve provincial coach passengers first.","D.  Serve the passenger with the shortest expected service time first."],"answer":"Correct answer: A","rubric":"FCFS follows arrival order among waiting eligible passengers, rather than ticket price or an invented priority rule.","table":[],"lecture":2,"correctOption":"A","lo":2},{"id":"Q2-C","heading":"Q2-C  |  Multiple choice","prompt":"A provincial business passenger reaches check-in while the dedicated business counter is idle and no other business passenger is waiting. Under the baseline, what happens?","options":["A.  The passenger joins the coach queue.","B.  The passenger must wait for a flight departure.","C.  The passenger begins check-in service immediately.","D.  The counter is removed from operation."],"answer":"Correct answer: C","rubric":"An arriving passenger can start immediately when the eligible counter is idle and there is no waiting predecessor.","table":[],"lecture":2,"correctOption":"C","lo":2},{"id":"Q3-A","heading":"Q3-A  |  Fill in the simulation table","prompt":"Complete the missing values in the check-in simulation table. Passengers are served in arrival order.\nAll time values are in minutes. Fill in the three numbered blank cells.","options":[],"answer":"(1) 4 minutes; (2) 3 minutes; (3) 1 minute.","rubric":"Check only the three numerical entries against the answer key. No explanation is required; all other table cells are given.","table":[[["Passenger","Interarrival","Arrival","Service","Start","Finish","Wait"],["A","—","0","4","0","4","0"],["B","2","2","3","(1) ____","7","2"],["C","1","(2) ____","2","7","9","4"],["D","5","8","1","9","10","(3) ____"]]],"lecture":2,"correctOption":null,"lo":3},{"id":"Q3-B","heading":"Q3-B  |  Fill in the simulation table","prompt":"Complete the table. The counter is allowed to be idle when no passenger is waiting.\nAll time values are in minutes. Fill in the three numbered blank cells.","options":[],"answer":"(1) 0 minutes; (2) 7 minutes; (3) 10 minutes.","rubric":"Check only the three numerical entries against the answer key. No explanation is required; all other table cells are given.","table":[[["Passenger","Interarrival","Arrival","Service","Start","Finish","Wait"],["A","—","0","2","0","2","0"],["B","4","4","3","4","7","(1) ____"],["C","1","5","1","(2) ____","8","2"],["D","2","7","2","8","(3) ____","1"]]],"lecture":2,"correctOption":null,"lo":3},{"id":"Q3-C","heading":"Q3-C  |  Fill in the simulation table","prompt":"Complete the missing cells while maintaining FCFS service order.\nAll time values are in minutes. Fill in the three numbered blank cells.","options":[],"answer":"(1) 5 minutes; (2) 6 minutes; (3) 3 minutes.","rubric":"Check only the three numerical entries against the answer key. No explanation is required; all other table cells are given.","table":[[["Passenger","Interarrival","Arrival","Service","Start","Finish","Wait"],["A","—","0","3","0","3","0"],["B","1","1","2","3","(1) ____","2"],["C","5","6","4","(2) ____","10","0"],["D","1","7","1","10","11","(3) ____"]]],"lecture":2,"correctOption":null,"lo":3},{"id":"Q4-A","heading":"Q4-A  |  Multiple choice","prompt":"Which set of columns is most useful for creating a simple airport check-in simulation table?","options":["A.  Passenger ID, arrival time, service duration, service start, completion, and waiting time.","B.  Aircraft paint color, runway length, and flight distance.","C.  Passenger name and ticket price only.","D.  A list of random numbers with no service or time information."],"answer":"Correct answer: A","rubric":"These fields connect random inputs and queue rules to observed service timing and waiting.","table":[],"lecture":2,"correctOption":"A","lo":4},{"id":"Q4-B","heading":"Q4-B  |  Multiple choice","prompt":"A passenger arrives at a check-in queue at minute 8, and another passenger completes check-in at minute 6. Which event appears first in a chronological simulation history?","options":["A.  The arrival at minute 8.","B.  Both events must occur at minute 0.","C.  The completion at minute 6.","D.  The events must be processed in passenger-ID order."],"answer":"Correct answer: C","rubric":"Events are recorded by simulation clock time, independent of passenger identifiers.","table":[],"lecture":2,"correctOption":"C","lo":4},{"id":"Q4-C","heading":"Q4-C  |  Multiple choice","prompt":"Why is it important for the check-in simulation table to include service completion times rather than only passenger arrival times?","options":["A.  Completion times are unrelated to queues.","B.  They determine when a counter becomes available and support waiting and service calculations.","C.  Arrival times and completion times are always equal.","D.  They replace the need to record service durations."],"answer":"Correct answer: B","rubric":"Service completion times are needed to determine subsequent service starts and reconstruct the queue history.","table":[],"lecture":2,"correctOption":"B","lo":4},{"id":"Q5-A","heading":"Q5-A  |  Multiple choice","prompt":"In a small teaching simulation, three passengers wait 0, 2, and 4 minutes for check-in. What is their mean waiting time?","options":["A.  1 minute.","B.  2 minutes.","C.  3 minutes.","D.  6 minutes."],"answer":"Correct answer: B","rubric":"Mean waiting time is (0 + 2 + 4) / 3 = 2 minutes. This is not a full-airport result.","table":[],"lecture":2,"correctOption":"B","lo":5},{"id":"Q5-B","heading":"Q5-B  |  Multiple choice","prompt":"Four of ten simulated passengers wait before starting check-in service. What is the observed fraction of passengers who waited?","options":["A.  10%.","B.  25%.","C.  40%.","D.  60%."],"answer":"Correct answer: C","rubric":"Four out of ten experienced a positive wait, giving 4/10 = 40%.","table":[],"lecture":2,"correctOption":"C","lo":5},{"id":"Q5-C","heading":"Q5-C  |  Multiple choice","prompt":"An illustrative check-in counter is busy for 36 minutes during a 60-minute observation period. What is its utilization?","options":["A.  36%.","B.  40%.","C.  50%.","D.  60%."],"answer":"Correct answer: D","rubric":"Utilization = busy time / observation time = 36/60 = 60%.","table":[],"lecture":2,"correctOption":"D","lo":5},{"id":"Q6-A","heading":"Q6-A  |  Multiple choice","prompt":"In the lecture’s periodic-review inventory example, what happens at a scheduled review when the inventory position is below the target level M?","options":["A.  The system permanently closes.","B.  An order is placed to raise the inventory position toward M.","C.  All demand is canceled.","D.  The review interval N is always set to zero."],"answer":"Correct answer: B","rubric":"The (M, N) review policy checks inventory at review intervals and replenishes toward its target.","table":[],"lecture":2,"correctOption":"B","lo":6},{"id":"Q6-B","heading":"Q6-B  |  Multiple choice","prompt":"In the lecture’s inventory example, what is a backorder?","options":["A.  A unit of demand not immediately satisfied that is recorded to be fulfilled after replenishment.","B.  Unsold inventory discarded at the end of the day.","C.  A machine that becomes idle.","D.  A random number used to generate service time."],"answer":"Correct answer: A","rubric":"Backordered demand remains outstanding and is served later when replenishment arrives.","table":[],"lecture":2,"correctOption":"A","lo":6},{"id":"Q6-C","heading":"Q6-C  |  Multiple choice","prompt":"Why do uncertain customer demands matter in inventory simulation?","options":["A.  Demand can never affect inventory levels.","B.  Inventory policies are meaningful only when demand is constant.","C.  Demand determines how stock changes and whether shortages or excess inventory arise.","D.  All demand must be served by check-in counters."],"answer":"Correct answer: C","rubric":"The inventory example shows how changing inputs and system rules influence shortages and stock levels. No airport inventory task is required.","table":[],"lecture":2,"correctOption":"C","lo":6},{"id":"Q7-A","heading":"Q7-A  |  Short answer","prompt":"A provincial flight has 96 paid coach reservations and 28 paid business reservations. Two coach passengers and one business passenger qualify for full refunds after missing the flight. The flight operating cost is $12,000. Calculate (1) gross ticket revenue and (2) flight profit.","options":[],"answer":"(1) Gross revenue = 96 × $500 + 28 × $1,000 = $76,000. Refunds = 2 × $500 + 1 × $1,000 = $2,000. (2) Profit = $76,000 − $2,000 − $12,000 = $62,000.","rubric":"Check only the two required values: $76,000 gross revenue and $62,000 profit. Intermediate refund arithmetic may be used for feedback.","table":[],"lecture":2,"correctOption":null,"lo":7},{"id":"Q7-B","heading":"Q7-B  |  Short answer","prompt":"At 10:30 AM, 53 commuter passengers are waiting for a 40-seat flight. At the next departure, 11:30 AM, another 18 passengers have joined the passengers left behind. Assume all passengers are eligible to board and no other arrivals occur. Each boarded passenger pays $200; each flight costs $1,500 to operate. Calculate (1) total ticket revenue and (2) total profit from these two departures.","options":[],"answer":"The first flight boards 40; 13 remain. The second boards 13 + 18 = 31. (1) Revenue = (40 + 31) × $200 = $14,200. (2) Profit = $14,200 − 2 × $1,500 = $11,200.","rubric":"Check only $14,200 revenue and $11,200 profit. Remaining passengers are not treated as lost sales or a separate expense.","table":[],"lecture":2,"correctOption":null,"lo":7},{"id":"Q7-C","heading":"Q7-C  |  Short answer","prompt":"Two check-in policies are evaluated for the same provincial flight. There are 120 paid coach reservations and 32 paid business reservations. The operating cost is $12,000 under both policies. The table gives the number of passengers receiving full refunds. Which policy has the higher flight profit, and by how much?","options":[],"answer":"Both have gross revenue = 120 × $500 + 32 × $1,000 = $92,000. Policy A refunds = 6 × $500 + 2 × $1,000 = $5,000; profit = $75,000. Policy B refunds = 2 × $500 + 1 × $1,000 = $2,000; profit = $78,000. Policy B is higher by $3,000.","rubric":"Check only the selected policy (B) and the profit difference ($3,000). No claim is made that Policy B actually wins in the real simulation.","table":[[["Passenger refunds","Policy A","Policy B"],["Coach refunds","6","2"],["Business refunds","2","1"]]],"lecture":2,"correctOption":null,"lo":7},{"id":"Q7-D","heading":"Q7-D  |  Short answer","prompt":"During an illustrative period, the airline operates one provincial flight and one commuter flight. The provincial flight has 105 paid coach reservations and 25 paid business reservations. Three coach passengers receive full refunds; one business passenger also misses the flight but is not eligible for a refund. The commuter flight boards 34 passengers. Calculate the total profit from these two departures.","options":[],"answer":"Provincial gross revenue = 105 × $500 + 25 × $1,000 = $77,500. Refunds = 3 × $500 = $1,500 (no refund for the ineligible business passenger). Provincial profit = $77,500 − $1,500 − $12,000 = $64,000. Commuter profit = 34 × $200 − $1,500 = $5,300. Combined profit = $69,300.","rubric":"Check only total profit = $69,300. Do not subtract a refund for the ineligible business passenger or a newspaper-style lost-profit penalty.","table":[],"lecture":2,"correctOption":null,"lo":7}],[{"id":"Q1-A","heading":"Q1-A  |  Multiple choice","prompt":"A coach passenger is waiting for an available check-in counter. Which statement correctly distinguishes this wait from the check-in service itself?","options":["A.  The queue wait is an activity with a fixed end time, while check-in is a delay.","B.  The queue wait is a delay whose end depends on counter availability; check-in is an activity whose duration is determined when it begins.","C.  Both periods must be entered on the FEL immediately when the passenger arrives.","D.  The queue wait and check-in service are both instantaneous events."],"answer":"Correct answer: B","rubric":"Waiting is a conditional delay; service is an activity with a computable duration when it starts (slides 9–11).","table":[],"lecture":3,"correctOption":"B","lo":1},{"id":"Q1-B","heading":"Q1-B  |  Multiple choice","prompt":"The coach check-in queue and the airport’s Future Event List are both ordered lists. What distinguishes their contents?","options":["A.  The coach queue stores future flight events, while the FEL stores passenger ticket prices.","B.  Both store only passengers, in exactly the same order.","C.  The coach queue stores waiting passengers; the FEL stores scheduled event notices ordered by event time.","D.  The FEL stores only past events and the coach queue stores completed passengers."],"answer":"Correct answer: C","rubric":"Passenger queues order entities by queue discipline; the FEL orders future event notices by time (slides 6–8).","table":[],"lecture":3,"correctOption":"C","lo":1},{"id":"Q1-C","heading":"Q1-C  |  Multiple choice","prompt":"A check-in completion is scheduled for minute 28. Which information belongs in the event notice?","options":["A.  Event type, event time, and identifiers needed to complete the corresponding service.","B.  Only the total number of passengers arriving that day.","C.  The entire history of every completed simulation run.","D.  Only the passenger’s final flight profit."],"answer":"Correct answer: A","rubric":"An event notice records when and what will happen and the data needed to execute it (slide 6).","table":[],"lecture":3,"correctOption":"A","lo":1},{"id":"Q2-A","heading":"Q2-A  |  Multiple choice","prompt":"A waiting coach passenger begins check-in immediately when another passenger finishes service. In the lecture’s event-scheduling terminology, what is the correct distinction?","options":["A.  Beginning service must be inserted as a future primary event when the passenger first arrives.","B.  The first passenger’s check-in completion is a scheduled primary event; the waiting passenger’s delay ends as a conditional transition.","C.  Both occurrences are unrelated to system state.","D.  The waiting passenger’s delay has a known duration as soon as they join the queue."],"answer":"Correct answer: B","rubric":"An activity completion is scheduled on the FEL, while a delay ends when the relevant system condition becomes true (slides 11–12 and 27).","table":[],"lecture":3,"correctOption":"B","lo":2},{"id":"Q2-B","heading":"Q2-B  |  Multiple choice","prompt":"Which of the following would typically be a primary event already scheduled on the FEL in a check-in simulation?","options":["A.  The moment a waiting passenger becomes first in line.","B.  The moment an idle counter is noticed by a waiting passenger.","C.  Completion of a check-in service whose duration was determined when it began.","D.  The condition that any one of five counters could serve a passenger."],"answer":"Correct answer: C","rubric":"Service completion is an activity-completion event and can be scheduled by an event notice (slides 10 and 12).","table":[],"lecture":3,"correctOption":"C","lo":2},{"id":"Q2-C","heading":"Q2-C  |  Multiple choice","prompt":"An arriving passenger has to wait because all eligible counters are busy. Why is the passenger’s service start not normally scheduled immediately for a fixed future time?","options":["A.  Its timing depends on future service completions and the queue conditions.","B.  Check-in counters cannot be represented as resources.","C.  Simulation clocks cannot measure waiting time.","D.  Passengers never receive service after joining a queue."],"answer":"Correct answer: A","rubric":"Service begins conditionally, after an eligible resource becomes available; the delay duration is not predetermined.","table":[],"lecture":3,"correctOption":"A","lo":2},{"id":"Q3-A","heading":"Q3-A  |  Multiple choice","prompt":"At CLOCK = 20, a snapshot records three passengers waiting for coach check-in and an event notice for check-in completion at minute 22. Which statement is correct?","options":["A.  The queue length is a current state value, while the notice describes a future event.","B.  The queue length must be stored as an event notice at minute 22.","C.  The future completion time is a passenger ticket attribute.","D.  The current state is unnecessary if the FEL is available."],"answer":"Correct answer: A","rubric":"A snapshot contains current system state and the FEL as distinct components (slides 16–17).","table":[],"lecture":3,"correctOption":"A","lo":3},{"id":"Q3-B","heading":"Q3-B  |  Multiple choice","prompt":"Which of the following should the airport simulator maintain to calculate average check-in waiting time at the end of a simulation run?","options":["A.  The number of passengers currently waiting for check-in.","B.  The waiting time of the passenger currently at the front of the queue.","C.  The sum of waiting times recorded for passengers who have begun check-in service.","D.  The time at which the next check-in counter becomes available."],"answer":"Correct answer: C","rubric":"This quantity, together with the corresponding passenger count, can be used to calculate average waiting time.","table":[],"lecture":3,"correctOption":"C","lo":3},{"id":"Q3-C","heading":"Q3-C  |  Multiple choice","prompt":"Which set of information would be most useful for continuing the airport simulation from its current snapshot?","options":["A.  Only the airline’s projected annual profit.","B.  Only the passenger IDs already boarded on earlier flights.","C.  Only the next flight’s ticket price.","D.  Current queues/resource states, relevant passenger records, FEL, and accumulated counters."],"answer":"Correct answer: D","rubric":"The simulation should retain sufficient current information to generate its next snapshot (slides 16 and 38).","table":[],"lecture":3,"correctOption":"D","lo":3},{"id":"Q4-A","heading":"Q4-A  |  Fill in the blanks","prompt":"At CLOCK = 5, the airport’s FEL contains these event notices. Complete the three blanks below. For the final field, consider only the events already on the list after removing the imminent event (before scheduling any new events).\nReference answers\nNext event = security completion; CLOCK becomes 7; earliest event remaining on the FEL = passenger arrival at minute 9.","options":[],"answer":"","rubric":"Grade only the event type and the two numerical values. The earliest event is selected and removed before evaluating the remaining FEL.","table":[[["Event notice","Scheduled time"],["Passenger arrival","9"],["Security completion","7"],["Check-in completion","12"]],[["Required response","Student answer"],["Next event to execute","(1) ______"],["New CLOCK value (min)","(2) ______"],["Next earliest existing FEL event (type and time)","(3) ______"]]],"lecture":3,"correctOption":null,"lo":4},{"id":"Q4-B","heading":"Q4-B  |  Fill in the blanks","prompt":"At CLOCK = 10, the FEL contains these events. Fill the missing event-selection information. For the last blank, use the events remaining on the original FEL, before adding new events.\nReference answers\nNext event = check-in completion; CLOCK becomes 13; next earliest remaining event = security completion at minute 16.","options":[],"answer":"","rubric":"Grade the event type and the two timestamps; do not request an explanation of the complete event handler.","table":[[["Event notice","Scheduled time"],["Passenger arrival","18"],["Check-in completion","13"],["Security completion","16"]],[["Required response","Student answer"],["Next event to execute","(1) ______"],["New CLOCK value (min)","(2) ______"],["Next earliest existing FEL event (type and time)","(3) ______"]]],"lecture":3,"correctOption":null,"lo":4},{"id":"Q4-C","heading":"Q4-C  |  Fill in the blanks","prompt":"At CLOCK = 60, a passenger arrival is scheduled for minute 61, a check-in completion for minute 65, and a commuter departure for minute 90. Complete the table. For the final blank, use the events remaining on the original FEL, before adding new events.\nReference answers\nNext event = passenger arrival; CLOCK becomes 61; next earliest remaining event = check-in completion at minute 65.","options":[],"answer":"","rubric":"Grade the event type and two timestamps. The clock jumps to the next scheduled event rather than moving one minute at a time.","table":[[["Event notice","Scheduled time"],["Passenger arrival","61"],["Check-in completion","65"],["Commuter flight departure","90"]],[["Required response","Student answer"],["Next event to execute","(1) ______"],["New CLOCK value (min)","(2) ______"],["Next earliest existing FEL event (type and time)","(3) ______"]]],"lecture":3,"correctOption":null,"lo":4},{"id":"Q5-A","heading":"Q5-A  |  Fill in the blanks","prompt":"At CLOCK = 16, passenger 27 begins check-in. The service duration has already been supplied as 4 minutes. Complete the future event notice.\nReference answers\nCheck-in completion; minute 20; passenger 27.","options":[],"answer":"","rubric":"Grade the three entries only. The completion time is 16 + 4 = 20.","table":[[["Event notice field","Student answer"],["Event type","(1) ______"],["Scheduled time (min)","(2) ______"],["Passenger ID","(3) ______"]]],"lecture":3,"correctOption":null,"lo":5},{"id":"Q5-B","heading":"Q5-B  |  Fill in the blanks","prompt":"At CLOCK = 25, passenger 13 begins security screening. The supplied screening duration is 5 minutes. Complete the event notice that must be added to the FEL.\nReference answers\nSecurity completion; minute 30; passenger 13.","options":[],"answer":"","rubric":"Grade the event type, time, and passenger identifier only.","table":[[["Event notice field","Student answer"],["Event type","(1) ______"],["Scheduled time (min)","(2) ______"],["Passenger ID","(3) ______"]]],"lecture":3,"correctOption":null,"lo":5},{"id":"Q5-C","heading":"Q5-C  |  Fill in the blanks","prompt":"A commuter passenger arrives at CLOCK = 40. The supplied time until the next commuter arrival is 3 minutes. Use bootstrapping to complete the next-arrival event notice.\nReference answers\nPassenger arrival (commuter arrival); minute 43; CLOCK remains 40 while scheduling the future notice.","options":[],"answer":"","rubric":"Grade the two times and event type. The new future arrival notice is scheduled at 40 + 3; scheduling does not itself advance the current clock.","table":[[["Event notice field","Student answer"],["Event type","(1) ______"],["Next scheduled arrival time (min)","(2) ______"],["Current CLOCK (min)","(3) ______"]]],"lecture":3,"correctOption":null,"lo":5},{"id":"Q6-A","heading":"Q6-A  |  Multiple choice","prompt":"A programmer models the airport using separate handlers for passenger arrival, check-in completion, security completion, and flight departure. Which world view best matches this approach?","options":["A.  Event scheduling.","B.  Process interaction.","C.  Activity scanning.","D.  Static modeling."],"answer":"Correct answer: A","rubric":"Event scheduling describes changes through event handlers (slides 30–32).","table":[],"lecture":3,"correctOption":"A","lo":6},{"id":"Q6-B","heading":"Q6-B  |  Multiple choice","prompt":"A simulator describes each passenger’s journey as “arrive, request check-in service, receive service, proceed to security, then reach the gate.” Which world view does this most closely match?","options":["A.  Activity scanning.","B.  Process interaction.","C.  A static inventory model.","D.  A performance-measure table."],"answer":"Correct answer: B","rubric":"Process interaction centers on each entity’s life cycle (slides 30–31).","table":[],"lecture":3,"correctOption":"B","lo":6},{"id":"Q6-C","heading":"Q6-C  |  Multiple choice","prompt":"Which statement best describes activity scanning as presented in the lecture?","options":["A.  It models only a passenger’s entire lifetime in the airport.","B.  It always keeps the simulation clock fixed at zero.","C.  It checks whether activity-start conditions are satisfied as simulated time advances.","D.  It means the check-in queue must be ordered by departure time."],"answer":"Correct answer: C","rubric":"Activity scanning focuses on activities and their start conditions (slides 30 and 32).","table":[],"lecture":3,"correctOption":"C","lo":6},{"id":"Q7-A","heading":"Q7-A  |  Fill in the blanks","prompt":"One illustrative FCFS check-in counter is idle at minute 0. Passenger A arrives at minute 2 and needs 4 minutes of service. Passenger B arrives at minute 3 and needs 2 minutes. Fill the three blank cells in the event trace. “New completion” means the event notice scheduled when service begins.\nReference answers\n(1) minute 6 (A check-in completes); (2) queue length 1; (3) minute 8 (B check-in completes).","options":[],"answer":"","rubric":"Check just the three missing values: 6, 1, and 8. At minute 6 the waiting passenger B immediately begins service.","table":[[["CLOCK / Event","Queue after event","Counter after event","New completion"],["2 / A arrives","0","","(1) ____"],["3 / B arrives","(2) ____","Busy","None"],["6 / A completes","0","Busy","(3) ____"],["8 / B completes","0","Idle","None"]]],"lecture":3,"correctOption":null,"lo":7},{"id":"Q7-B","heading":"Q7-B  |  Fill in the blanks","prompt":"One illustrative FCFS check-in counter is idle initially. A arrives at minute 0 (service 3 minutes); B arrives at minute 1 (service 4 minutes); C arrives at minute 2 (service 1 minute). Fill the three missing cells.\nReference answers\n(1) queue length 2; (2) minute 7 (B check-in completion); (3) queue length 0.","options":[],"answer":"","rubric":"Check only the three blanks: 2, 7, and 0. The service order is A, then B, then C.","table":[[["CLOCK / Event","Queue after event","Counter after event","New completion"],["0 / A arrives","0","Busy","3"],["1 / B arrives","1","Busy","None"],["2 / C arrives","(1) ____","Busy","None"],["3 / A completes","1","Busy","(2) ____"],["7 / B completes","(3) ____","Busy","8"]]],"lecture":3,"correctOption":null,"lo":7},{"id":"Q7-C","heading":"Q7-C  |  Fill in the blanks","prompt":"One illustrative FCFS check-in counter is idle initially. A arrives at minute 0 (service 2 minutes); B arrives at minute 4 (service 3 minutes); C arrives at minute 5 (service 1 minute). Fill the three missing cells.\nReference answers\n(1) Idle; (2) queue length 1; (3) minute 8 (C check-in completion).","options":[],"answer":"","rubric":"Check just Idle, 1, and 8. No resources are added or removed from the full airport project.","table":[[["CLOCK / Event","Queue after event","Counter after event","New completion"],["0 / A arrives","0","Busy","2"],["2 / A completes","0","(1) ____","None"],["4 / B arrives","0","Busy","7"],["5 / C arrives","(2) ____","Busy","None"],["7 / B completes","0","Busy","(3) ____"]]],"lecture":3,"correctOption":null,"lo":7},{"id":"Q8-A","heading":"Q8-A  |  Multiple choice","prompt":"Our airport needs two different ordered collections: a queue of waiting coach passengers and a list of scheduled future events. How should they be ordered?","options":["A.  Both strictly by passenger ID.","B.  Passengers by ticket price; events by service duration.","C.  Coach queue by the applicable service rule (FCFS in the baseline); FEL by scheduled event time.","D.  Both in random order."],"answer":"Correct answer: C","rubric":"Different ordering rules serve different purposes (slides 8 and 39–41).","table":[],"lecture":3,"correctOption":"C","lo":8},{"id":"Q8-B","heading":"Q8-B  |  Multiple choice","prompt":"A simulation programmer stores an event-notice record. Which fields are essential?","options":["A.  Event time, event type, and identifying data needed when it executes.","B.  Only the running total of airline profit.","C.  Only the contents of the coach waiting queue.","D.  Only the names of the airport’s destinations."],"answer":"Correct answer: A","rubric":"Event-notice records contain type, time, and associated event data (slide 40).","table":[],"lecture":3,"correctOption":"A","lo":8},{"id":"Q8-C","heading":"Q8-C  |  Multiple choice","prompt":"Why might the simulator use a structure that efficiently retrieves the earliest scheduled event?","options":["A.  To prevent passengers from arriving at the
