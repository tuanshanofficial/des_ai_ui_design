<script>
const data=[
["Lecture 1","Why use simulation?","A simulation imitates the operation of a system over time. It lets us explore what-if questions using a model instead of disrupting real operations.","A hospital can investigate how changing appointment procedures affects waiting times without experimenting on actual patients."],
["Lecture 1","Performance evaluation","Performance evaluation uses quantitative measures to compare alternatives, predict behavior and diagnose a system. Common measures include waiting time, utilization, throughput and cost.","In a bank, compare two service policies using the average queue wait and the percentage of time a teller is busy."],
["Lecture 1","Three evaluation approaches","Performance measurement observes a real system; analytical modeling uses mathematical relationships; simulation modeling runs a model to estimate system behavior.","Measuring a real grocery checkout records actual queues; a queue formula estimates expected delay; a computer simulation recreates arrivals and services over time."],
["Lecture 1","Simulation, systems and models","A system is a collection of interacting objects pursuing a purpose. A model is a simplified representation retaining the details relevant to a study. A simulation generates artificial operating history and analyzes it.","To study a bank queue, represent customers, tellers and service operations; omit wall color because it does not affect the question."],
["Lecture 1","System boundaries and assumptions","A system boundary determines which processes are modeled and which belong to the environment. Assumptions reduce complexity, but must support valid conclusions.","A grocery checkout model may begin when a shopper joins the checkout line and end when payment finishes. Traveling to the store lies outside that boundary."],
["Lecture 1","Types of models","A physical model resembles a system; a mathematical model uses symbols and equations. Static models omit explicit time, dynamic models represent change; deterministic models have fixed outcomes, stochastic models include randomness.","A Monte Carlo estimate with no evolving state can be static; a randomly arriving customer queue evolving over time is dynamic and stochastic."],
["Lecture 1","Discrete-event system components","An entity is an object of interest; an attribute belongs to an entity; an activity takes time; an event occurs at an instant; state variables describe the system at a moment.","At a bank: a customer is an entity, account type is an attribute, service is an activity, service completion is an event, and the number waiting is a state variable."],
["Lecture 1","When simulation is appropriate","Simulation helps when processes interact and direct experiments are costly or impractical. It is less appropriate when an easy analytical solution suffices or credible inputs cannot be obtained.","Use simulation to study complicated patient flows; do not build a complex simulator merely to calculate the known total cost of three identical products."],
["Lecture 2","Random numbers and observations","A uniform random number U between 0 and 1 is converted to an observation using a cumulative probability table. U is not itself a duration.","Suppose service times 1, 2 and 3 minutes occur with probabilities .20, .30 and .50. Their intervals are [0,.20), [.20,.50), [.50,1). U=.14 yields 1 minute; U=.82 yields 3 minutes."],
["Lecture 2","Queueing system components","A queueing system includes the calling population, arrival process, service mechanism, capacity and service discipline. FCFS means first come, first served.","At a grocery store, customers arrive, wait for an available checkout and are served in arrival order. A busy cashier creates a waiting line."],
["Lecture 2","Single-server simulation","For one FCFS server: service start is the later of arrival and previous finish; completion = start + service duration; waiting = start − arrival.","Four customers: A arrives 0, service 3, starts 0, finishes 3, waits 0. B arrives 1, service 2, starts 3, finishes 5, waits 2. C arrives 6, service 2, starts 6, finishes 8, waits 0. D arrives 7, service 1, starts 8, finishes 9, waits 1."],
["Lecture 2","Simulation tables","A simulation table connects input observations, changing state and resulting measures. Typical columns include customer ID, arrival, service duration, service start, completion and waiting time.","Using the preceding four-customer example, B begins at minute 3 because A finishes then; the server is idle between minute 5 and 6."],
["Lecture 2","Performance measures from a run","Mean wait = sum of waits / customer count; fraction waiting = number with positive wait / customer count; utilization = busy time / observation time; time in system = departure minus arrival.","With waits 0,2,0,1, mean wait = 3/4 = 0.75 minute and 2 of 4 waited. If a server is busy 36 minutes during 60 minutes, utilization = 60%."],
["Lecture 2","Inventory simulation","In periodic-review inventory, stock is inspected at intervals. Replenishment can raise the inventory position toward a target; uncertain demand may create backorders or stockouts.","If the target inventory position is 20 and the observed position at a review is 13, order 7 units to restore the position to 20, subject to the policy's accounting rules."],
["Lecture 2","Newsdealer simulation and profit","A newsdealer chooses a stock quantity before uncertain demand is known. Sales revenue, purchase cost and salvage receipts determine profit. Repeated demand scenarios reveal risk.","If 10 newspapers cost $2 each, 8 sell at $5 and two unsold copies yield $0.50 each in salvage, profit = 8×5 + 2×0.50 − 10×2 = $21."],
["Lecture 3","DES building blocks","The simulation clock represents current simulated time. A waiting list stores entities according to a rule; a future event list (FEL) stores event notices sorted by their scheduled times.","At CLOCK=12, a customer can be waiting in a service queue while an event notice says another customer's service will complete at minute 15."],
["Lecture 3","Activities versus delays","An activity has a duration determined when it begins. A delay lasts until conditions allow it to end, so its finish time generally cannot be specified in advance.","A clerk begins a five-minute service at minute 10, so completion is at 15. A customer waiting for a free clerk has an unknown waiting duration until service becomes possible."],
["Lecture 3","Primary and secondary events","In this event-scheduling terminology, a primary event is completion of an activity recorded on the FEL. A secondary event is completion of a conditional delay when the required state condition becomes true.","When a clerk finishes service, the scheduled completion event may free the clerk. The next customer's delay then ends without requiring a previously scheduled notice for that delay."],
["Lecture 3","System snapshots","A snapshot records everything needed to continue: current state, entities, future event notices and accumulated statistics.","At CLOCK=20: queue length 3; server busy; future completion scheduled for 22; cumulative waiting time so far 14 minutes. These represent different aspects of the same snapshot."],
["Lecture 3","Future event list and time advance","Next-event simulation finds the earliest notice in the FEL, advances CLOCK to that timestamp, executes the event, updates state and schedules newly created events.","At CLOCK=5, notices are arrival 9, completion 7 and completion 12. Execute the completion at 7 first; CLOCK jumps to 7, not to 6."],
["Lecture 3","Generating and scheduling events","Initialization sets clock, states, lists and counters. New arrival times may be generated by adding an interarrival duration to current time. Starting an activity creates its future completion notice.","At CLOCK=16, a service lasting 4 minutes schedules a service-completion notice for minute 20."],
["Lecture 3","Simulation world views","Event scheduling organizes logic around events; process interaction describes an entity's lifetime; activity scanning checks conditions that permit activities to begin.","The sequence arrive → wait → receive service → leave is a process-interaction view. Separate arrival and completion handlers express event scheduling."],
["Lecture 3","Manual event processing","On arrival, start service if an eligible server is idle; otherwise enqueue. On completion, take the next waiting customer or make the server idle, then schedule any new completion.","One clerk: A arrives at 2 needing 4 minutes and finishes at 6. B arrives at 3 and waits. At 6, B begins 2 minutes of service and finishes at 8."],
["Lecture 3","Simulator organization","An initialization routine creates the opening snapshot. A timing routine selects the next event. Event routines update state and statistics. Termination stops the run; a reporting routine calculates results.","A queue simulator repeatedly selects the earliest completion or arrival, executes its handler, updates the FEL, and eventually reports average waiting and utilization."]
];

["What problem should a simulation investigate if one of six counters is idle while other passengers wait?","text"],["Why can simulation evaluate new service arrangements without disrupting real operations?","mc",["It guarantees shorter waits","It tests arrangements using a model","It removes randomness","It makes assumptions unnecessary"],1],
["Which process boundary best fits passenger processing?","mc",["Runway construction","Only travel to the airport","Check-in, security and boarding outcomes","Aircraft maintenance"],2],
["How should a changing, uncertain, event-driven system be classified?","mc",["Static and deterministic","Dynamic, stochastic and discrete","Static and continuous","Deterministic and continuous"],1],
["Identify three important modeled objects or resources in an airport passenger-processing system.","text"],
["What can a long check-in delay cause later?","mc",["Automatically faster security","Automatic departure postponement","Later security arrival and a missed flight","No effect on later stages"],2],
["Which measures support comparison of the same six counters?","mc",["Only queue length","Only number of counters","Waiting, utilization, missed flights and profit","Only arrivals"],2],
["With service times 1,2,3 minutes having probabilities .20,.30,.50, what do U=.14 and U=.82 produce?","text"],
["When all eligible coach counters are busy under FCFS, what does the next coach passenger do?","mc",["Use a dedicated business counter","Join the coach queue","Skip check-in","Add a counter"],1],
["One FCFS clerk: A arrives 0, service 3; B arrives 1, service 2. When does B start, finish and how long wait?","text"],
["What is the purpose of a simulation table?","mc",["Record only ticket prices","Record inputs, timings and outcomes","Avoid tracking events","Replace service durations"],1],
["Three customers wait 0,2,4 minutes. What is the mean?","mc",["1 minute","2 minutes","3 minutes","6 minutes"],1],
["At a periodic inventory review, stock is below the target. What action does a replenishment policy specify?","mc",["Stop operations","Order toward the target","Cancel demand","Always reduce stock"],1],
["What is profit based on in a single-period newsdealer example?","mc",["Only demand","Sales and salvage receipts minus purchase costs","Only unsold stock","Only service time"],1],
["Which statement correctly distinguishes a waiting delay from service activity?","mc",["Wait is fixed","Wait depends on server availability; service duration is determined at start","Both are instantaneous","Both are already on the FEL"],1],
["Which event is a scheduled primary event?","mc",["A waiting customer moving to front","A queue becoming shorter","Completion of a started service","A customer deciding to wait"],2],
["A snapshot at CLOCK=20 includes three waiting and a completion at 22. Which is correct?","mc",["Queue is current state; completion notice is future event","Both are past events","Queue is a ticket price","No state is needed"],0],
["At CLOCK=5 the FEL contains arrival 9, completion 7 and completion 12. What runs next, and what is the new clock?","text"],
["At CLOCK=16 a service lasts 4 minutes. What event and time should be added to the FEL?","text"],
["Separate arrival and completion event handlers represent which view?","mc",["Event scheduling","Process interaction","Activity scanning","Static modeling"],0],
["A arrives minute 2, service 4; B arrives minute 3, service 2; one FCFS server. At what time does B finish?","text"],
["What ordering is used for the FEL?","mc",["Alphabetical passenger name","Scheduled event time","Highest ticket price","Longest service first"],1],
["Which program component selects the next event?","mc",["Reporting routine","Timing routine","Ticketing policy","Initialization only"],1]
];const intro="Now that you have learned the fundamentals of discrete-event simulation, it is time to apply those concepts to a realistic engineering problem. Throughout this course, you will progressively construct a simulation of passenger processing at Smiths Falls / Montague Airport and evaluate how different operating policies affect service quality and airline profitability.";
function render(){document.getElementById("study").classList.toggle("hidden",stage!=="study");document.getElementById("appPage").classList.toggle("hidden",stage==="study");if(stage==="study"){let a=data[pos];document.getElementById("unit").textContent=a[0]+" · Concept "+(pos+1)+" of "+data.length;document.getElementById("heading").textContent=a[1];document.getElementById("body").innerHTML="<h2>Explanation</h2><p>"+a[2]+"</p><div class='example'><strong>Worked example</strong><p>"+a[3]+"</p></div>";document.getElementById("progress").textContent=(pos+1)+" / "+data.length;document.getElementById("back").disabled=pos===0;document.getElementById("next").textContent=pos===data.length-1?"Apply to Project →":"Next →";return}const p=document.getElementById("appPage");if(stage==="intro"){p.innerHTML="<button onclick='goStudy()'>← Back to Course Materials</button><p class='muted'>CHAPTER 1 COMPLETE</p><h1>Project Introduction</h1><p>"+intro+"</p><h2>Regional Airport Passenger Processing Study</h2><p>One airline operates commuter flights to Ottawa and provincial flights to Calgary. Commuter passengers can wait for a later flight; provincial passengers reserve a specific departure and may miss it if processing takes too long. The model follows passenger arrival → check-in → security → flight departure.</p><p>The airport has <strong>six check-in counters in total</strong>, fixed across all experiments. You will compare the baseline (one dedicated business counter and five coach counters), a fully pooled six-counter FCFS policy, and a hybrid arrangement with departure-aware nonpreemptive priority. The aim is to understand passenger waits, resource utilization, missed flights, eligible refunds and airline profit.</p><div class='callout'>Financial performance includes ticket revenue, applicable refunds, scheduled flight operating costs and profit. You will develop the model progressively; you are not expected to implement the full simulator now.</div><div class='nav'><button onclick='goStudy()'>← Review concepts</button><button class='primary' onclick='startQuiz()'>Apply to Project →</button></div>";return}let q=questions[qidx],saved=JSON.parse(localStorage.getItem("des_answers")||"{}"),v=saved[qidx]||"";p.innerHTML="<button onclick='goStudy()'>← Back to Course Materials</button><p class='muted'>Project application · Question "+(qidx+1)+" of "+questions.length+"</p><h1>Apply to Project</h1><p class='question'>"+q[0]+"</p>"+(q[1]==="text"?"<textarea id='response' rows='5' placeholder='Explain your reasoning...'></textarea>":"<div class='opts'>"+q[2].map((x,i)=>"<label><input type='radio' name='choice' value='"+i+"'>"+x+"</label>").join("")+"</div>")+"<div class='nav'><button onclick='quizPrev()'>← Previous</button><span class='muted'>Your answer is saved when you navigate</span><button class='primary' onclick='quizNext()'>"+(qidx===questions.length-1?"Finish":"Next →")+"</button></div>";if(q[1]==="text")document.getElementById("response").value=v;else{let el=p.querySelector("input[value='"+v+"']");if(el)el.checked=true}}
function save(){let q=questions[qidx],v=q[1]==="text"?document.getElementById("response")?.value:document.querySelector("input[name=choice]:checked")?.value;if(v!==undefined){let o=JSON.parse(localStorage.getItem("des_answers")||"{}");o[qidx]=v;localStorage.setItem("des_answers",JSON.stringify(o))}}
function next(){if(pos<data.length-1){pos++;localStorage.setItem("des_pos",pos)}else stage="intro";localStorage.setItem("des_stage",stage);render()}

function jump(i){pos=i;stage="study";localStorage.setItem("des_pos",pos);localStorage.setItem("des_stage",stage);closeDrawer();render()}
function closeDrawer(){document.getElementById("drawer").classList.remove("open")}
function goStudy(){if(stage==="quiz")save();stage="study";localStorage.setItem("des_stage",stage);render()}

function quizNext(){save();if(qidx===questions.length-1){alert("Responses saved in this browser. Adaptive AI grading is not yet connected.");return}qidx++;localStorage.setItem("des_qidx",qidx);render()}
