const KEY='des-tutor-chapter1-revised-v1'; const L=DATA.lessons,B=DATA.banks;
let initial={view:'learn',index:0,chat:[],questionIndex:0,selected:{},drafts:{},submitted:{},questions:null,applicationUnlocked:false};
let S;try{S={...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){S={...initial}};
if(!Array.isArray(S.questions)||S.questions.length!==23){S.questions=[];for(let i=0;i<3;i++){let pools={};B[i].forEach(q=>(pools[q.lo]??=[]).push(q));Object.keys(pools).sort((a,b)=>+a-+b).forEach(lo=>{let a=pools[lo];let chosen=a[Math.floor(Math.random()*a.length)];S.questions.push({lecture:i+1,id:chosen.id})})}}
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}function setView(v){if(v==='quiz')S.applicationUnlocked=true;S.view=v;save();render()}function returnToApplication(){setView(S.applicationUnlocked?'quiz':'intro')}function go(i){S.index=Math.max(0,Math.min(L.length-1,i));S.view='learn';save();render()}function question(){const q=S.questions[S.questionIndex];return B[q.lecture-1].find(x=>x.id===q.id)}function idKey(){let q=S.questions[S.questionIndex];return `${q.lecture}:${q.id}`}
function render(){if(S.view==='quiz')S.applicationUnlocked=true;document.getElementById('headerStatus').textContent=S.view==='learn'?'Course Materials':S.view==='intro'?'Project Introduction':'Apply to Project';document.getElementById('headerSwitcher').innerHTML=`<button class="btn ${S.view==='learn'?'current':'ghost'}" onclick="go(S.index)" ${S.view==='learn'?'disabled':''}>Course Materials</button>${S.applicationUnlocked||S.view==='intro'?`<button class="btn ${S.view==='quiz'?'current':'ghost'}" onclick="returnToApplication()" ${S.view==='quiz'?'disabled':''}>${S.view==='quiz'?'Apply to Project':'Return to Question →'}</button>`:''}`;let el=document.getElementById('app');if(S.view==='learn')el.innerHTML=renderLearn();else if(S.view==='intro')el.innerHTML=renderIntro();else el.innerHTML=renderQuiz();save();drawSidebar()}
function renderLearn(){let x=L[S.index],isLast=S.index===L.length-1;return `<div class="cols"><article class="panel course"><div class="eyebrow">Course Materials · Lecture ${x.lecture} of 3</div><h1 class="h1">${esc(['','Introduction to Simulation','Simulation Examples','General Principles and Simulation Software'][x.lecture])}</h1><div class="small">Concept ${S.index+1} of ${L.length}</div><div class="progress"><div style="width:${(S.index+1)/L.length*100}%"></div></div><h2 style="font-size:23px;margin-top:26px">${esc(x.title)}</h2><p class="lead">${esc(x.body)}</p><div class="section"><div class="label">REMEMBER</div><p>${esc(x.idea)}</p></div><div class="lessonDetail">${x.detail}</div><div class="nav lessonNav"><div class="navPrev">${S.index===0?'':`<button class="btn ghost" onclick="go(${S.index-1})">← Previous concept</button>`}</div><span class="small">${S.index+1} / ${L.length}</span><button class="btn navNext" onclick="${isLast?"returnToApplication()":`go(${S.index+1})`}">${isLast?(S.applicationUnlocked?'Return to Question →':'Apply to Project →'):'Next concept →'}</button></div></article><aside class="panel chat"><div><b>◉ AI Tutor</b><div class="small">Learning mode · Discussion panel demo</div></div><div class="chatMessages" id="chatMessages">${S.chat.length?S.chat.map(m=>`<div class="bubble ${m.role==='student'?'student':''}">${esc(m.text)}</div>`).join(''):'<div class="bubble">Ask a question about the current concept. Live tutoring will be available when the RAG backend is connected.</div>'}</div><div class="chatFoot"><input id="chatInput" placeholder="Ask a question…" onkeydown="if(event.key==='Enter')sendChat()"><button class="btn" onclick="sendChat()">Send</button></div></aside></div>`}

function drawSidebar(){const drawer=document.getElementById('lessonDrawer');if(!drawer)return;drawer.innerHTML=`<div class="drawerHead"><b>Chapter 1 concepts</b><button aria-label="Close navigation" onclick="toggleSidebar(false)">×</button></div><div class="drawerScroll">${[1,2,3].map(n=>`<div class="drawerGroup">Lecture ${n} · ${['','Introduction','Simulation Examples','General Principles'][n]}</div>${L.map((x,i)=>x.lecture===n?`<button class="drawerLesson ${S.view==='learn'&&S.index===i?'active':''}" onclick="go(${i});toggleSidebar(false)"><span>${n}.${L.slice(0,i+1).filter(y=>y.lecture===n).length}</span> ${esc(x.title)}</button>`:'').join('')}`).join('')}</div><div class="drawerFoot">Select any concept to review it.</div>`}
function toggleSidebar(v){document.body.classList.toggle('drawerOpen',v);document.getElementById('drawerTab').setAttribute('aria-expanded',String(v))}

function sendChat(){let box=document.getElementById('chatInput');let v=box.value.trim();if(!v)return;S.chat.push({role:'student',text:v},{role:'ai',text:'Your question is saved in this demo. The RAG tutor has not been connected yet, so I cannot provide a course-grounded live reply.'});save();render();document.getElementById('chatMessages').scrollTop=1e6}
function renderIntro(){return `<article class="panel intro"><div class="eyebrow">Chapter 1 complete · Before your first application</div><h1 class="introTitle">Apply what you've learned to a real simulation problem</h1><p class="lead">Now that you have learned the fundamentals of discrete-event simulation, you can begin applying those concepts to a practical project. Throughout this course, you will progressively develop a simulation of passenger processing at a regional airport. You will start by identifying the problem and its main components, then build toward an event-driven model and, eventually, compare operating policies using evidence from simulation.</p><h2>Meet your project</h2><p class="lead">The project takes place at the <b>Smiths Falls / Montague Airport</b>, where a hypothetical airline serves both regional commuter passengers travelling to Ottawa and provincial passengers travelling to Calgary. Commuter travellers can wait for a later flight if the next flight is full; provincial travellers have reservations for scheduled departures, so excessive processing delays may cause missed flights.</p><div class="factGrid"><div class="fact"><strong>Fixed resources</strong>The airport has <b>six check-in counters</b> in every experiment. The baseline uses one provincial business-class counter and five shared coach counters.</div><div class="fact"><strong>Passenger journey</strong>Passengers arrive, complete check-in, pass through security, then attempt to board their flights.</div><div class="fact"><strong>What you will compare</strong>Dedicated counters, fully pooled counters, and a hybrid policy with non-preemptive departure-aware priority — always using the same six counters.</div><div class="fact"><strong>What matters</strong>Passenger waiting, utilization, commuter boarding, provincial missed flights, eligible refunds, ticket revenue, scheduled flight costs, and airline profit.</div></div><div class="section"><div class="label">YOUR TASK AT THIS STAGE</div><p>You are not expected to build the complete airport simulator yet. Use the concepts from Lectures 1–3 to reason about the airport problem, simple queueing examples, and the structure of event-driven simulation.</p></div><div class="nav"><button class="btn ghost" onclick="go(${L.length-1})">← Back to Course Materials</button><button class="btn" onclick="setView('quiz')">Start Apply to Project →</button></div><div class="footer">Project information adapted from the supplied Regional Airport Passenger Processing Simulation Study and Lecture 1–3 instructor references.</div></article>`}
function renderTable(tables){return (tables||[]).map(rows=>`<div class="gridtable"><table>${rows.map((cells,i)=>`<tr>${cells.map(v=>`<${i===0?'th':'td'}>${esc(v)}</${i===0?'th':'td'}>`).join('')}</tr>`).join('')}</table></div>`).join('')}
function renderQuiz(){let q=question(),k=idKey(),selected=S.selected[k]??'',draft=S.drafts[k]??'',sub=S.submitted[k];return `<article class="panel assessment"><div class="nav" style="margin-top:0"><button class="btn ghost" onclick="go(${S.index})">← Back to Course Materials</button><span class="tag">Chapter 1 · Question ${S.questionIndex+1} of 23</span></div><h1 class="h1" style="margin-top:24px">Apply to Project</h1><p class="muted">Lecture ${q.lecture} · Learning Objective ${q.lo} · ${q.options.length?'Multiple choice':'Short answer / worked response'}</p><div class="progress"><div style="width:${(S.questionIndex+1)/23*100}%"></div></div><div class="question">${esc(q.prompt)}</div>${renderTable(q.table)}${q.options.length?`<div class="options">${q.options.map(o=>`<label class="option"><input type="radio" name="ans" value="${esc(o[0])}" ${selected===o[0]?'checked':''} onchange="choose('${o[0]}')"><span>${esc(o)}</span></label>`).join('')}</div>`:`<textarea id="draft" class="answer" placeholder="Write your answer or numbered values here…" oninput="setDraft(this.value)">${esc(draft)}</textarea>`}<div class="small">Your draft and navigation progress are saved in this browser. You can return to any concept without resetting this question.</div>${sub?`<div class="toast">${esc(sub)}</div>`:''}<div class="nav"><button class="btn ghost" ${S.questionIndex===0?'disabled':''} onclick="navigateQuiz(-1)">← Previous question</button><button class="btn subtle" onclick="submitAnswer()">Save response</button><button class="btn" ${S.questionIndex===22?'disabled':''} onclick="navigateQuiz(1)">Next question →</button></div><p class="warning" style="margin-top:22px">Offline prototype: multiple-choice choices can be stored, but adaptive hints, instructor-grade feedback, and short-answer evaluation require the actual pedagogical backend. No reference answers are shown here.</p><div class="footer">Assessment items adapted from supplied Lecture_${q.lecture}.docx instructor question bank. One question is selected per learning objective.</div></article>`}
function choose(c){S.selected[idKey()]=c;save()}function setDraft(v){S.drafts[idKey()]=v;save()}function submitAnswer(){let k=idKey(),q=question(),value=q.options.length?S.selected[k]:S.drafts[k];if(!String(value??'').trim()){alert('Enter or select an answer first.');return}S.submitted[k]='Response saved locally. Live AI assessment is not connected in this demo.';save();render()}function navigateQuiz(d){S.questionIndex=Math.max(0,Math.min(22,S.questionIndex+d));save();render()};render();
</script></body></html>
