:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172c41;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}.top{background:white;border-bottom:1px solid #dce3eb;padding:15px max(20px,calc((100vw - 1350px)/2));display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:19px}.small{font-size:12px;color:#647589}.wrap{max-width:1350px;margin:25px auto;padding:0 20px}.tag{border:1px solid #d9e2ee;border-radius:99px;padding:6px 11px;color:#41566c;font-size:12px}.cols{display:grid;grid-template-columns:minmax(0,7fr) minmax(280px,3fr);gap:18px}.panel{background:white;border:1px solid #dce4ed;border-radius:14px;box-shadow:0 1px 3px #193d5b0b}.course{padding:28px 32px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:#5f7790;font-size:11px;font-weight:700}.h1{font-size:28px;letter-spacing:-.02em;margin:7px 0 8px}.lead{font-size:16px;line-height:1.8;color:#31465b}.section{border-left:3px solid #2d73a9;background:#f3f7fc;border-radius:0 9px 9px 0;padding:14px 18px;margin:18px 0}.section p{margin:5px 0;line-height:1.65}.label{font-size:12px;font-weight:800;color:#355c7d}.example{background:#f8f6ee;border:1px solid #f0e3b8;border-radius:10px;padding:16px;margin:20px 0;line-height:1.65}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:25px}.lessonNav{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}.lessonNav .navPrev{justify-self:start}.lessonNav .navNext{justify-self:end}.viewSwitch{display:flex;align-items:center;gap:8px}.viewSwitch button{padding:9px 13px}.viewSwitch .current{background:#eaf4fc;border:1px solid #a9cae7;color:#155885}.reviewShortcut{display:flex;justify-content:flex-end;margin:12px 0 0}.reviewShortcut button{font-size:13px}.btn{border:0;border-radius:9px;padding:11px 17px;font-weight:700;background:#226caa
